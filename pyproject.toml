[project]
name = "jarvis"
version = "0.1.0"
description = "A local-first, always-listening voice assistant with a calm British-butler voice."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

# ---------------------------------------------------------------------------
# Core dependencies.
#
# Deliberately light: everything here installs in seconds and has no native
# audio or ML wheels. `uv sync` with just these gives you a working text-mode
# JARVIS (`python -m jarvis --text`) and a full health check. The heavy voice
# and memory stacks live in the optional extras below so that CI, the test
# suite, and text-mode development never pay for a 2 GB torch download.
# ---------------------------------------------------------------------------
dependencies = [
    "anthropic>=0.40",
    "httpx>=0.27",
    "numpy>=1.26",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "rich>=13.7",
]

[project.optional-dependencies]
# Everything needed to actually hear and speak. Installs native wheels.
voice = [
    "sounddevice>=0.4.6",
    "openwakeword>=0.6.0",
    "faster-whisper>=1.0.3",
    "piper-tts>=1.2.0",
]
# Semantic recall over stored facts (milestone 5). Pulls in torch.
memory = [
    "sentence-transformers>=3.0",
]
# Optional cloud TTS adapter. Piper remains the offline default.
elevenlabs = [
    "elevenlabs>=1.0",
]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "mypy>=1.10",
    "ruff>=0.5",
    "types-PyYAML>=6.0",
]
# Convenience aggregate: `uv sync --extra full`
full = [
    "jarvis[voice,memory]",
]

[project.scripts]
jarvis = "jarvis.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jarvis"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
asyncio_mode = "auto"
markers = [
    "hardware: requires a real microphone, speaker, or downloaded model (skipped in CI)",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.mypy]
plugins = ["pydantic.mypy"]
python_version = "3.11"
strict = true
warn_unreachable = true
# Optional extras are absent in CI; don't fail on their missing stubs.
[[tool.mypy.overrides]]
module = [
    "sounddevice.*",
    "openwakeword.*",
    "faster_whisper.*",
    "piper.*",
    "sentence_transformers.*",
    "elevenlabs.*",
]
ignore_missing_imports = true

[tool.coverage.run]
source = ["src/jarvis"]
